# DEVELOPMENT infrastructure only (weak passwords on purpose). Every port is published on 127.0.0.1, so nothing here can be reached from the
# network the computer is on. The real stack, with real passwords, is deploy/docker-compose.yml.
services:  
  postgres:
    image: postgres:latest
    container_name: market_postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - docker_pgdata:/var/lib/postgresql
    networks:
      - market-net

  redis:
    image: redis:latest
    container_name: market_redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - market-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: market_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"    # AMQP port the application connects to
      - "127.0.0.1:15672:15672"  # management web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - market-net

volumes:
  docker_pgdata:
    external: true

networks:
  market-net:
    driver: bridge