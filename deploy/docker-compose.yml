# The whole stack: Postgres, the API, the admin panel and the collector.
#   cp deploy/.env.example deploy/.env      (fill it in)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Nothing here touches the root docker-compose.yml, which is only the development infrastructure.
# On a server with a domain, add `--profile public` to also start Caddy: HTTPS for the panel on ports 80 and 443 (see deploy/README.md).

# Not "tradepulse": the root docker-compose.yml takes that name from the folder, and compose would then treat the two files as one project
# (and recreate the development database of the root file with the definition below).
name: tradepulse-stack

# Every connection string below ends with GSS Encryption Mode=Disable: the images have no Kerberos library, and without it Npgsql prints
# "Cannot load library libgssapi_krb5.so.2" at every start. Nothing here uses Kerberos (the roles log in with passwords).
x-probe: &probe
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  postgres:
    # Same major version as the development database (the root docker-compose.yml runs the latest), so a dump of that one can be
    # restored here: pg_restore cannot read a dump made by a newer pg_dump.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tradepulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      # Since PostgreSQL 18 the image keeps the data in a versioned folder under /var/lib/postgresql, so the volume goes there, not
      # on /var/lib/postgresql/data (which would leave the data outside the volume).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The stack's own network, and "data-net": the way for the program that makes signals to read the stored candles (role tp_signal_source,
    # read-only). Under the name tradepulse-postgres there, so it cannot be mistaken for a database of that program's own.
    networks:
      default: {}
      data-net:
        aliases: [tradepulse-postgres]
    restart: unless-stopped

  # Creates and migrates the schema, so it is the first of the three to be healthy.
  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # The API has its own role (tp_api): it owns the schemas auth, config and research, and may read the data tables. Not the
      # superuser. The roles are made by deploy/main-db-roles.sh; see docs/database-security.md.
      ConnectionStrings__DefaultConnection: &api-db Host=postgres;Database=tradepulse;Username=tp_api;Password=${API_DB_PASSWORD:?set API_DB_PASSWORD in deploy/.env (letters and digits, e.g. openssl rand -hex 24), then run deploy/main-db-roles.sh};GSS Encryption Mode=Disable
      ConnectionStrings__AuthConnection: *api-db
      ConnectionStrings__ConfigConnection: *api-db
      # The API alone signs the tokens (ES256), so it alone holds the private key. See deploy/make-jwt-keys.sh.
      JwtConfigurations__PrivateKey: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in deploy/.env (run ./deploy/make-jwt-keys.sh and paste the two lines)}
      # The public half too, only so that the API checks at start that the two lines belong together (the vault gets the same line).
      JwtConfigurations__PublicKey: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in deploy/.env (the other half of JWT_PRIVATE_KEY, from ./deploy/make-jwt-keys.sh)}
      AdminConfigurations__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in deploy/.env}
      AdminConfigurations__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env}
      Collector__HealthUrl: http://collector:8080/health
      # A bot of its own for "somebody is trying to get into an account" (wrong two-factor codes, many wrong passwords). Not the collector's bot:
      # its token stays out of this container. Empty: such alerts are only written to the audit log.
      SecurityAlerts__InstanceName: ${ALERT_INSTANCE_NAME:-tradepulse}
      SecurityAlerts__Telegram__BotToken: ${SECURITY_TELEGRAM_BOT_TOKEN:-}
      SecurityAlerts__Telegram__ChatId: ${SECURITY_TELEGRAM_CHAT_ID:-}
      # The same mail server as the collector's alerts. Without SMTP_HOST and SMTP_FROM the API offers no sign-in codes by email.
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UserName: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-}
    volumes:
      - api-keys:/keys
    ports:
      - "127.0.0.1:${API_PORT:-8087}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/lookups/exchanges HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  # The database of the key vault: a Postgres of its own, on a network that only the trader is on (and that cannot reach the internet).
  # The API, the collector and the panel can neither reach it nor have its password, so a hacked one of them, or a leak of the main
  # database, does not hand out the encrypted keys, the orders, the daily budget or the halt switch. See docs/database-security.md.
  vault-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:?set VAULT_DB_PASSWORD in deploy/.env (letters and digits, e.g. openssl rand -hex 24)}
    volumes:
      - vault-pgdata:/var/lib/postgresql
    networks: [vault-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The key vault: the only program that holds the private keys of the users' exchange keys (and later the one that trades with them).
  # It has NO published port: only the panel reaches it, over this stack's internal network. It trusts the same access tokens as the
  # API, and it alone knows VAULT_MASTER_KEY, so a database dump or a hacked API/panel does not give anybody a usable key.
  trader:
    build: { context: .., dockerfile: deploy/Dockerfile, target: trader }
    depends_on:
      api: { condition: service_healthy }
      vault-db: { condition: service_healthy }
    networks: [default, vault-net]
    environment:
      # Its own database (keys, orders, limits, the halt switch, the enabled symbols).
      ConnectionStrings__Vault: Host=vault-db;Database=vault;Username=vault;Password=${VAULT_DB_PASSWORD};GSS Encryption Mode=Disable
      # The main database, through a role that may only add to the audit log and publish the copy of the enabled symbols
      # (made by deploy/main-db-roles.sh). If it cannot be reached, trading goes on and the problem is logged.
      ConnectionStrings__Main: Host=postgres;Database=tradepulse;Username=tp_trader;Password=${TRADER_MAIN_DB_PASSWORD:?set TRADER_MAIN_DB_PASSWORD in deploy/.env (letters and digits, e.g. openssl rand -hex 24), then run deploy/main-db-roles.sh};GSS Encryption Mode=Disable
      # Only the PUBLIC key: the vault can check a token and cannot make one. It refuses to start if it is given the private key.
      JwtConfigurations__PublicKey: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in deploy/.env (the other half of JWT_PRIVATE_KEY, from ./deploy/make-jwt-keys.sh)}
      JwtConfigurations__Issuer: TradePulseApi
      JwtConfigurations__Audience: TradePulseClient
      AdminConfigurations__Role: Administrator
      Vault__MasterKey: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in deploy/.env (openssl rand -base64 32), and keep a copy outside this server}
      # Wrong trading codes and lock-outs go to the same security bot as the API's (see docs/exchange-keys.md).
      SecurityAlerts__InstanceName: ${ALERT_INSTANCE_NAME:-tradepulse}
      SecurityAlerts__Telegram__BotToken: ${SECURITY_TELEGRAM_BOT_TOKEN:-}
      SecurityAlerts__Telegram__ChatId: ${SECURITY_TELEGRAM_CHAT_ID:-}
      # What may be traded and how much (see docs/trading.md). Real money stays off until TRADING_ALLOW_LIVE=true.
      Trading__AllowLive: ${TRADING_ALLOW_LIVE:-false}
      Trading__Halted: ${TRADING_HALTED:-false}
      Trading__MaxOrderUsd: ${TRADING_MAX_ORDER_USD:-100}
      Trading__MaxDailyUsd: ${TRADING_MAX_DAILY_USD:-500}
      Trading__AllowedSymbols__0: ${TRADING_SYMBOL_1:-BTCUSDT}
      Trading__AllowedSymbols__1: ${TRADING_SYMBOL_2:-ETHUSDT}
    healthcheck:
      <<: *probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  panel:
    build: { context: .., dockerfile: deploy/Dockerfile, target: panel }
    depends_on:
      api: { condition: service_healthy }
      trader: { condition: service_healthy }
    environment:
      Api__BaseUrl: http://api:8080
      Trader__BaseUrl: http://trader:8080
    volumes:
      - panel-keys:/keys
    ports:
      - "127.0.0.1:${PANEL_PORT:-8088}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /Login HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  # The only service that is reachable from the internet, and only with `--profile public`. Everything else stays on
  # 127.0.0.1 or inside the stack.
  caddy:
    profiles: ["public"]
    image: caddy:2.10-alpine
    depends_on:
      panel: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      SITE_DOMAIN: ${SITE_DOMAIN:-site.localhost}
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  collector:
    build: { context: .., dockerfile: deploy/Dockerfile, target: collector }
    depends_on:
      api: { condition: service_healthy }
    environment:
      # The collector has its own role (tp_collector): it owns and writes the data tables and reads the config tables that say what to
      # collect. It cannot see the accounts (auth) or anything else.
      ConnectionStrings__DefaultConnection: Host=postgres;Database=tradepulse;Username=tp_collector;Password=${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD in deploy/.env (letters and digits, e.g. openssl rand -hex 24), then run deploy/main-db-roles.sh};GSS Encryption Mode=Disable
      Alerts__InstanceName: ${ALERT_INSTANCE_NAME:-tradepulse}
      Alerts__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Alerts__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      Alerts__Email__Host: ${SMTP_HOST:-}
      Alerts__Email__Port: ${SMTP_PORT:-587}
      Alerts__Email__UserName: ${SMTP_USER:-}
      Alerts__Email__Password: ${SMTP_PASSWORD:-}
      Alerts__Email__From: ${SMTP_FROM:-}
      Alerts__Email__To: ${SMTP_TO:-}
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8089}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  # The price watch (src/Research, `watch`): follows the live trades of the symbols switched on in the panel (and of those enabled for
  # trading), and tells the admin about a sudden move. Its own process and its own database role (tp_watch: reads the lists and the
  # candles, writes only research.shock_alerts), so nothing it does can slow the collector. Nothing listens here: it only calls out
  # (Binance, its Telegram bot). The rule and its evidence: docs/research.md.
  watch:
    build: { context: .., dockerfile: deploy/Dockerfile, target: watch }
    depends_on:
      api: { condition: service_healthy }
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=tradepulse;Username=tp_watch;Password=${WATCH_DB_PASSWORD:?set WATCH_DB_PASSWORD in deploy/.env (letters and digits, e.g. openssl rand -hex 24), then run deploy/main-db-roles.sh};GSS Encryption Mode=Disable
      # A bot of its own, not the collector's. Empty: the alerts only go to the log (docker compose logs watch) and to research.shock_alerts.
      Watch__Alerts__InstanceName: ${ALERT_INSTANCE_NAME:-tradepulse} watch
      Watch__Alerts__Telegram__BotToken: ${WATCH_TELEGRAM_BOT_TOKEN:-}
      Watch__Alerts__Telegram__ChatId: ${WATCH_TELEGRAM_CHAT_ID:-}
      # How unusual a 15 minute move must be: 4.5 is about 2.6 messages a week per symbol, 5.0 the quieter choice (about 1.4). See docs/research.md.
      Watch__Rule__GradualMinZScore: ${WATCH_GRADUAL_MIN_Z:-4.5}
    restart: unless-stopped

  # The signals (docs/signals.md), with `--profile signals`: the webhook of the program that makes them, the paper trades opened from them, the
  # follow of their price and the messages of the chat. Its own process and its own database role (tp_signals: writes only schema `signals`,
  # reads the symbol lists and the data tables), so nothing it does can slow the collector. It has no public port: the sender reaches it on the
  # network `tradepulse-signals` (which only this service and the sender join), or on 127.0.0.1:SIGNALS_PORT of this machine.
  signals:
    profiles: ["signals"]
    build: { context: .., dockerfile: deploy/Dockerfile, target: signals }
    depends_on:
      # The API creates and migrates the schema `signals`.
      api: { condition: service_healthy }
    networks: [default, signals-net]
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=tradepulse;Username=tp_signals;Password=${SIGNALS_DB_PASSWORD:-};GSS Encryption Mode=Disable
      # The secret the sender signs its requests with (at least 32 characters, `openssl rand -hex 32`). The program does not start without it.
      Signals__Webhook__Secret: ${SIGNALS_WEBHOOK_SECRET:-}
      # While the secret is being changed: the one before it, still accepted. Empty otherwise.
      Signals__Webhook__PreviousSecret: ${SIGNALS_WEBHOOK_PREVIOUS_SECRET:-}
      # A bot of its own for the messages of the paper trades. Empty: they only go to the log (docker compose logs signals).
      Signals__Telegram__BotToken: ${SIGNALS_TELEGRAM_BOT_TOKEN:-}
      Signals__Telegram__ChatId: ${SIGNALS_TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${SIGNALS_PORT:-8090}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: unless-stopped

  # ---- monitoring (optional: `--profile monitoring`, set up with deploy/netdata-setup.sh, see docs/monitoring.md)
  # The server's CPU, memory, disk, the memory of every container over days (a leak shows as a slope), Postgres' connections and more, with
  # alerts to a Telegram bot of its own. Netdata runs with no extra rights: not in the host's process or network space, no capabilities. What
  # it reads of the host is read-only. The names of the containers come through a proxy that answers only "list the containers": a plain mount
  # of the Docker socket would be the key to the whole host, and this host holds the key vault.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: [monitoring]
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitor-net]
    restart: unless-stopped

  netdata:
    image: netdata/netdata:v2.12.3
    profiles: [monitoring]
    depends_on: [docker-proxy]
    hostname: ${ALERT_INSTANCE_NAME:-tradepulse}
    environment:
      DOCKER_HOST: docker-proxy:2375
      # No anonymous statistics to Netdata. The agent is not claimed to Netdata Cloud either (no claim token anywhere in this file).
      DO_NOT_TRACK: 1
    ports:
      # The server itself only: look at it through an ssh tunnel (ssh -L 19999:127.0.0.1:19999 <server>), never publish it.
      - "127.0.0.1:${NETDATA_PORT:-19999}:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Made by deploy/netdata-setup.sh from deploy/.env (they hold the monitor's database password and its Telegram token).
      - ./netdata/go.d/postgres.conf:/etc/netdata/go.d/postgres.conf:ro
      - ./netdata/health_alarm_notify.conf:/etc/netdata/health_alarm_notify.conf:ro
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
    security_opt:
      - no-new-privileges:true
    # On the network of the stack (to reach Postgres) and on the proxy's.
    networks: [default, monitor-net]
    restart: unless-stopped

networks:
  # Joined by the trader and its database only. "internal": nothing on it can reach the internet or the other containers.
  vault-net:
    internal: true
  # The monitoring agent and the Docker proxy only.
  monitor-net:
    internal: true
  # The signals service and the program that makes the signals (which joins it from its own compose file as an external network): the sender can
  # reach the webhook (http://signals:8080) and nothing else of the stack.
  signals-net:
    name: tradepulse-signals
  # Postgres and whoever reads the stored candles (the program that makes the signals joins it from its own compose file as an external network).
  # "internal": it gives no way out to the internet. The database itself is protected by the roles: tp_signal_source can only read the data tables.
  data-net:
    name: tradepulse-data
    internal: true

volumes:
  pgdata:
  # The vault's database: the encrypted private keys of the exchange keys and the orders. Back it up with deploy/backup.sh.
  vault-pgdata:
  # Keys of data protection (the sign-in cookies of the panel, tokens of the API): without them a restart signs everyone out.
  api-keys:
  panel-keys:
  # The certificates Caddy got; losing them means asking Let's Encrypt again (which limits how often).
  caddy-data:
  caddy-config:
  # What the monitoring agent has measured (days of history) and its cache.
  netdata-lib:
  netdata-cache:
