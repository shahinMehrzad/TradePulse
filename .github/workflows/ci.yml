name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotNetTradePulse.slnx

      - name: Build
        run: dotnet build DotNetTradePulse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DotNetTradePulse.slnx --configuration Release --no-build
